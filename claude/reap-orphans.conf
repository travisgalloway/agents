# Config for ~/.claude/hooks/reap-orphans.sh
#
# Sourced as shell. Every value can also be overridden by an env var of the same name,
# which is what the test suite does.

# Roots whose orphaned processes are reapable. Space-separated. A process qualifies when its
# executable path, or any path on its command line, lives under one of these.
REAP_ROOTS="$HOME/github"

# Never kill anything whose full command matches this extended regex — even when it is an
# orphan under a root. Add to this when you deliberately detach something long-lived.
REAP_PROTECT='claude|mcp@latest|[Dd]ocker|colima|postgres|redis|ssh|tmux|screen'

# Minimum age in seconds before an orphan is reapable. Guards against catching a process
# during the moment between its parent exiting and a supervisor re-adopting it.
REAP_MIN_AGE=120
